[package]
name = "sparrow"
version = "0.1.0"
edition = "2024"
default-run = "sparrow"
description = "State-of-the-art nesting heuristic for 2D irregular strip packing problems"

[[bin]]
name = "sparrow"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bench.rs"

[[bin]]
name = "sparrow-tui"
path = "src/bin/sparrow-tui.rs"
required-features = ["tui"]

[dependencies]
jagua-rs = { features = ["spp"], version = "0.8.0" }
rand = "0.10"
rand_distr = "0.6"
svg = "0.18"
itertools = "0.15"
log = { version = "0.4", features = ["release_max_level_info"] }
fern = "0.7"
serde = "1.0"
serde_json = "1.0"
tap = "1.0"
slotmap = "1.1"
float-cmp = "0.10"
ordered-float = "5.5"
rayon = "1.12"
numfmt = "1.2"
num_cpus = "1.17"
jiff = "0.2"
test-case = "3.3"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
crossterm = { version = "0.29", optional = true }
image = { version = "0.25", default-features = false, optional = true }
ratatui = { version = "0.30", optional = true }
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm"], optional = true }
resvg = { version = "0.48", optional = true }

getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = "3.5"

[features]
live_svg = []
only_final_svg = []
simd = []
tui = ["dep:crossterm", "dep:image", "dep:ratatui", "dep:ratatui-image", "dep:resvg"]

[profile.dev]
overflow-checks = true

[profile.debug-release]
inherits = "release"
debug-assertions = true
debug = true

[profile.release]
opt-level = 3
lto = "fat"

[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true
debug = true
